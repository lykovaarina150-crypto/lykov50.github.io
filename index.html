<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Изометрическая комната подростка</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #controls {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(30, 30, 50, 0.9);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 12px;
            color: #fff;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 100;
        }
        #controls h2 {
            margin-bottom: 15px;
            font-size: 16px;
            color: #7dd3fc;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 13px;
            text-align: left;
        }
        .btn:hover {
            background: rgba(125, 211, 252, 0.15);
            border-color: #7dd3fc;
        }
        .btn.active {
            background: rgba(125, 211, 252, 0.25);
            border-color: #7dd3fc;
            box-shadow: 0 0 12px rgba(125, 211, 252, 0.3);
        }
        #info {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 30, 50, 0.8);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 8px;
            color: rgba(255,255,255,0.7);
            font-size: 12px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="controls">
        <h2>🏠 Вид комнаты</h2>
        <div class="btn-group">
            <button class="btn active" data-mode="all">Все 4 стены</button>
            <button class="btn" data-mode="back">Только задняя стена</button>
            <button class="btn" data-mode="floor">Только пол</button>
        </div>
    </div>
    
    <div id="info">
        ЛКМ — вращение | Колёсико — зум | ПКМ — перемещение
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        // Isometric camera
        const aspect = window.innerWidth / window.innerHeight;
        const d = 12;
        const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
        camera.position.set(15, 15, 15);
        camera.lookAt(0, 0, 0);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.screenSpacePanning = true;
        controls.maxPolarAngle = Math.PI / 2;
        controls.minDistance = 5;
        controls.maxDistance = 40;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffffff, 0.8);
        mainLight.position.set(10, 20, 10);
        mainLight.castShadow = true;
        mainLight.shadow.camera.left = -20;
        mainLight.shadow.camera.right = 20;
        mainLight.shadow.camera.top = 20;
        mainLight.shadow.camera.bottom = -20;
        mainLight.shadow.mapSize.width = 2048;
        mainLight.shadow.mapSize.height = 2048;
        scene.add(mainLight);

        const fillLight = new THREE.DirectionalLight(0x7dd3fc, 0.3);
        fillLight.position.set(-10, 10, -5);
        scene.add(fillLight);

        // Room dimensions
        const roomWidth = 10;
        const roomDepth = 10;
        const roomHeight = 6;
        const wallThickness = 0.2;

        // Materials
        const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x8B7355, roughness: 0.8 });
        const wallMaterial = new THREE.MeshStandardMaterial({ color: 0xE8DCC8, roughness: 0.9, side: THREE.DoubleSide });
        const ceilingMaterial = new THREE.MeshStandardMaterial({ color: 0xF5F5F0, roughness: 0.9 });

        // Room structure
        const walls = new THREE.Group();
        
        // Floor
        const floor = new THREE.Mesh(
            new THREE.BoxGeometry(roomWidth, wallThickness, roomDepth),
            floorMaterial
        );
        floor.position.y = -wallThickness / 2;
        floor.receiveShadow = true;
        walls.add(floor);

        // Back wall
        const backWall = new THREE.Mesh(
            new THREE.BoxGeometry(roomWidth, roomHeight, wallThickness),
            wallMaterial
        );
        backWall.position.set(0, roomHeight / 2, -roomDepth / 2);
        backWall.castShadow = true;
        backWall.receiveShadow = true;
        walls.add(backWall);

        // Left wall
        const leftWall = new THREE.Mesh(
            new THREE.BoxGeometry(wallThickness, roomHeight, roomDepth),
            wallMaterial
        );
        leftWall.position.set(-roomWidth / 2, roomHeight / 2, 0);
        leftWall.castShadow = true;
        leftWall.receiveShadow = true;
        walls.add(leftWall);

        // Right wall
        const rightWall = new THREE.Mesh(
            new THREE.BoxGeometry(wallThickness, roomHeight, roomDepth),
            wallMaterial
        );
        rightWall.position.set(roomWidth / 2, roomHeight / 2, 0);
        rightWall.castShadow = true;
        rightWall.receiveShadow = true;
        walls.add(rightWall);

        // Front wall
        const frontWall = new THREE.Mesh(
            new THREE.BoxGeometry(roomWidth, roomHeight, wallThickness),
            wallMaterial
        );
        frontWall.position.set(0, roomHeight / 2, roomDepth / 2);
        frontWall.castShadow = true;
        frontWall.receiveShadow = true;
        walls.add(frontWall);

        // Ceiling
        const ceiling = new THREE.Mesh(
            new THREE.BoxGeometry(roomWidth, wallThickness, roomDepth),
            ceilingMaterial
        );
        ceiling.position.y = roomHeight;
        ceiling.receiveShadow = true;
        walls.add(ceiling);

        scene.add(walls);

        // Furniture group
        const furniture = new THREE.Group();

        // === BED ===
        const bedGroup = new THREE.Group();
        
        // Bed frame
        const bedFrame = new THREE.Mesh(
            new THREE.BoxGeometry(3, 0.4, 5),
            new THREE.MeshStandardMaterial({ color: 0x6B4423 })
        );
        bedFrame.position.set(-3, 0.2, -2);
        bedFrame.castShadow = true;
        bedFrame.receiveShadow = true;
        bedGroup.add(bedFrame);

        // Mattress
        const mattress = new THREE.Mesh(
            new THREE.BoxGeometry(2.8, 0.3, 4.8),
            new THREE.MeshStandardMaterial({ color: 0xF0E6D2 })
        );
        mattress.position.set(-3, 0.55, -2);
        mattress.castShadow = true;
        bedGroup.add(mattress);

        // Pillow
        const pillow = new THREE.Mesh(
            new THREE.BoxGeometry(1.2, 0.2, 0.8),
            new THREE.MeshStandardMaterial({ color: 0xFFFFFF })
        );
        pillow.position.set(-3, 0.8, -4);
        pillow.castShadow = true;
        bedGroup.add(pillow);

        // Blanket
        const blanket = new THREE.Mesh(
            new THREE.BoxGeometry(2.6, 0.15, 3),
            new THREE.MeshStandardMaterial({ color: 0x4A90E2 })
        );
        blanket.position.set(-3, 0.75, -1);
        blanket.castShadow = true;
        bedGroup.add(blanket);

        // Headboard
        const headboard = new THREE.Mesh(
            new THREE.BoxGeometry(3, 1.5, 0.2),
            new THREE.MeshStandardMaterial({ color: 0x5D3A1A })
        );
        headboard.position.set(-3, 1.15, -4.4);
        headboard.castShadow = true;
        bedGroup.add(headboard);

        furniture.add(bedGroup);

        // === DESK ===
        const deskGroup = new THREE.Group();

        // Desk top
        const deskTop = new THREE.Mesh(
            new THREE.BoxGeometry(3, 0.15, 1.5),
            new THREE.MeshStandardMaterial({ color: 0x8B6F47 })
        );
        deskTop.position.set(3, 1.5, -3.5);
        deskTop.castShadow = true;
        deskTop.receiveShadow = true;
        deskGroup.add(deskTop);

        // Desk legs
        const legPositions = [
            [1.6, 0.75, -4.1],
            [4.4, 0.75, -4.1],
            [1.6, 0.75, -2.9],
            [4.4, 0.75, -2.9]
        ];
        legPositions.forEach(pos => {
            const leg = new THREE.Mesh(
                new THREE.BoxGeometry(0.15, 1.5, 0.15),
                new THREE.MeshStandardMaterial({ color: 0x6B4423 })
            );
            leg.position.set(...pos);
            leg.castShadow = true;
            deskGroup.add(leg);
        });

        // Computer monitor
        const monitorStand = new THREE.Mesh(
            new THREE.BoxGeometry(0.3, 0.5, 0.3),
            new THREE.MeshStandardMaterial({ color: 0x333333 })
        );
        monitorStand.position.set(3, 1.85, -3.5);
        monitorStand.castShadow = true;
        deskGroup.add(monitorStand);

        const monitorScreen = new THREE.Mesh(
            new THREE.BoxGeometry(1.8, 1.2, 0.1),
            new THREE.MeshStandardMaterial({ color: 0x1a1a2e, emissive: 0x7dd3fc, emissiveIntensity: 0.3 })
        );
        monitorScreen.position.set(3, 2.5, -3.5);
        monitorScreen.castShadow = true;
        deskGroup.add(monitorScreen);

        // Keyboard
        const keyboard = new THREE.Mesh(
            new THREE.BoxGeometry(1.2, 0.05, 0.4),
            new THREE.MeshStandardMaterial({ color: 0x2a2a2a })
        );
        keyboard.position.set(3, 1.6, -3.2);
        keyboard.castShadow = true;
        deskGroup.add(keyboard);

        // Mouse
        const mouse = new THREE.Mesh(
            new THREE.BoxGeometry(0.2, 0.05, 0.3),
            new THREE.MeshStandardMaterial({ color: 0x2a2a2a })
        );
        mouse.position.set(4.2, 1.6, -3.2);
        mouse.castShadow = true;
        deskGroup.add(mouse);

        // Desk lamp
        const lampBase = new THREE.Mesh(
            new THREE.CylinderGeometry(0.2, 0.25, 0.1),
            new THREE.MeshStandardMaterial({ color: 0x333333 })
        );
        lampBase.position.set(1.8, 1.6, -3.8);
        lampBase.castShadow = true;
        deskGroup.add(lampBase);

        const lampArm = new THREE.Mesh(
            new THREE.CylinderGeometry(0.03, 0.03, 0.8),
            new THREE.MeshStandardMaterial({ color: 0x333333 })
        );
        lampArm.position.set(1.8, 2, -3.8);
        lampArm.castShadow = true;
        deskGroup.add(lampArm);

        const lampShade = new THREE.Mesh(
            new THREE.ConeGeometry(0.25, 0.3, 16),
            new THREE.MeshStandardMaterial({ color: 0xFFD700, emissive: 0xFFD700, emissiveIntensity: 0.2 })
        );
        lampShade.position.set(1.8, 2.5, -3.8);
        lampShade.castShadow = true;
        deskGroup.add(lampShade);

        furniture.add(deskGroup);

        // === CHAIR ===
        const chairGroup = new THREE.Group();

        const chairSeat = new THREE.Mesh(
            new THREE.BoxGeometry(1, 0.1, 1),
            new THREE.MeshStandardMaterial({ color: 0x4A4A4A })
        );
        chairSeat.position.set(3, 1, -2);
        chairSeat.castShadow = true;
        chairGroup.add(chairSeat);

        const chairBack = new THREE.Mesh(
            new THREE.BoxGeometry(1, 1.2, 0.1),
            new THREE.MeshStandardMaterial({ color: 0x4A4A4A })
        );
        chairBack.position.set(3, 1.6, -2.5);
        chairBack.castShadow = true;
        chairGroup.add(chairBack);

        const chairLegs = [
            [2.6, 0.5, -1.6],
            [3.4, 0.5, -1.6],
            [2.6, 0.5, -2.4],
            [3.4, 0.5, -2.4]
        ];
        chairLegs.forEach(pos => {
            const leg = new THREE.Mesh(
                new THREE.CylinderGeometry(0.05, 0.05, 1),
                new THREE.MeshStandardMaterial({ color: 0x333333 })
            );
            leg.position.set(...pos);
            leg.castShadow = true;
            chairGroup.add(leg);
        });

        furniture.add(chairGroup);

        // === BOOKSHELF ===
        const shelfGroup = new THREE.Group();

        const shelfBack = new THREE.Mesh(
            new THREE.BoxGeometry(2, 4, 0.1),
            new THREE.MeshStandardMaterial({ color: 0x6B4423 })
        );
        shelfBack.position.set(4, 2, -4.9);
        shelfBack.castShadow = true;
        shelfGroup.add(shelfBack);

        const shelfSides = [
            new THREE.Mesh(new THREE.BoxGeometry(0.1, 4, 0.8), new THREE.MeshStandardMaterial({ color: 0x6B4423 })),
            new THREE.Mesh(new THREE.BoxGeometry(0.1, 4, 0.8), new THREE.MeshStandardMaterial({ color: 0x6B4423 }))
        ];
        shelfSides[0].position.set(3, 2, -4.5);
        shelfSides[1].position.set(5, 2, -4.5);
        shelfSides.forEach(s => { s.castShadow = true; shelfGroup.add(s); });

        for (let i = 0; i < 4; i++) {
            const shelf = new THREE.Mesh(
                new THREE.BoxGeometry(2, 0.08, 0.8),
                new THREE.MeshStandardMaterial({ color: 0x6B4423 })
            );
            shelf.position.set(4, 0.5 + i * 1.2, -4.5);
            shelf.castShadow = true;
            shelf.receiveShadow = true;
            shelfGroup.add(shelf);

            // Books
            for (let j = 0; j < 5; j++) {
                const book = new THREE.Mesh(
                    new THREE.BoxGeometry(0.15, 0.8, 0.6),
                    new THREE.MeshStandardMaterial({ 
                        color: new THREE.Color().setHSL(Math.random(), 0.6, 0.4)
                    })
                );
                book.position.set(3.3 + j * 0.25, 1 + i * 1.2, -4.5);
                book.castShadow = true;
                shelfGroup.add(book);
            }
        }

        furniture.add(shelfGroup);

        // === POSTERS ===
        const posterColors = [0xFF6B6B, 0x4ECDC4, 0xFFE66D, 0x95E1D3];
        for (let i = 0; i < 4; i++) {
            const poster = new THREE.Mesh(
                new THREE.BoxGeometry(1.2, 1.6, 0.02),
                new THREE.MeshStandardMaterial({ 
                    color: posterColors[i],
                    emissive: posterColors[i],
                    emissiveIntensity: 0.1
                })
            );
            poster.position.set(-2 + i * 1.5, 3.5, -4.85);
            poster.castShadow = true;
            furniture.add(poster);
        }

        // === CLOTHES ON FLOOR ===
        const clothes = [
            { pos: [1, 0.05, 2], size: [0.8, 0.1, 0.6], color: 0xE74C3C },
            { pos: [-1, 0.05, 3], size: [0.6, 0.1, 0.8], color: 0x3498DB },
            { pos: [2, 0.05, 1], size: [0.5, 0.1, 0.5], color: 0x2ECC71 }
        ];
        clothes.forEach(item => {
            const cloth = new THREE.Mesh(
                new THREE.BoxGeometry(...item.size),
                new THREE.MeshStandardMaterial({ color: item.color, roughness: 0.9 })
            );
            cloth.position.set(...item.pos);
            cloth.rotation.y = Math.random() * Math.PI;
            cloth.castShadow = true;
            furniture.add(cloth);
        });

        // === RUG ===
        const rug = new THREE.Mesh(
            new THREE.BoxGeometry(4, 0.05, 3),
            new THREE.MeshStandardMaterial({ color: 0x8E44AD, roughness: 0.95 })
        );
        rug.position.set(0, 0.025, 1);
        rug.receiveShadow = true;
        furniture.add(rug);

        // === NIGHTSTAND ===
        const nightstand = new THREE.Mesh(
            new THREE.BoxGeometry(0.8, 0.8, 0.8),
            new THREE.MeshStandardMaterial({ color: 0x6B4423 })
        );
        nightstand.position.set(-1, 0.4, -3);
        nightstand.castShadow = true;
        nightstand.receiveShadow = true;
        furniture.add(nightstand);

        // Alarm clock
        const clock = new THREE.Mesh(
            new THREE.BoxGeometry(0.3, 0.3, 0.15),
            new THREE.MeshStandardMaterial({ color: 0x333333, emissive: 0xFF0000, emissiveIntensity: 0.3 })
        );
        clock.position.set(-1, 0.95, -3);
        clock.castShadow = true;
        furniture.add(clock);

        // === PLANT ===
        const pot = new THREE.Mesh(
            new THREE.CylinderGeometry(0.3, 0.25, 0.5, 16),
            new THREE.MeshStandardMaterial({ color: 0xD2691E })
        );
        pot.position.set(-4, 0.25, 3);
        pot.castShadow = true;
        furniture.add(pot);

        const plant = new THREE.Mesh(
            new THREE.SphereGeometry(0.5, 16, 16),
            new THREE.MeshStandardMaterial({ color: 0x228B22 })
        );
        plant.position.set(-4, 0.9, 3);
        plant.castShadow = true;
        furniture.add(plant);

        // === GUITAR ===
        const guitarBody = new THREE.Mesh(
            new THREE.SphereGeometry(0.4, 16, 16),
            new THREE.MeshStandardMaterial({ color: 0x8B4513 })
        );
        guitarBody.position.set(4, 0.5, 2);
        guitarBody.scale.set(1, 0.3, 1.3);
        guitarBody.castShadow = true;
        furniture.add(guitarBody);

        const guitarNeck = new THREE.Mesh(
            new THREE.BoxGeometry(0.1, 0.1, 1.2),
            new THREE.MeshStandardMaterial({ color: 0x654321 })
        );
        guitarNeck.position.set(4, 0.5, 3.2);
        guitarNeck.castShadow = true;
        furniture.add(guitarNeck);

        scene.add(furniture);

        // Wall visibility control
        const wallModes = {
            all: { back: true, left: true, right: true, front: true, ceiling: true },
            back: { back: true, left: false, right: false, front: false, ceiling: false },
            floor: { back: false, left: false, right: false, front: false, ceiling: false }
        };

        function setWallMode(mode) {
            const config = wallModes[mode];
            backWall.visible = config.back;
            leftWall.visible = config.left;
            rightWall.visible = config.right;
            frontWall.visible = config.front;
            ceiling.visible = config.ceiling;
        }

        // Button handlers
        document.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                setWallMode(btn.dataset.mode);
            });
        });

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Resize handler
        window.addEventListener('resize', () => {
            const aspect = window.innerWidth / window.innerHeight;
            camera.left = -d * aspect;
            camera.right = d * aspect;
            camera.top = d;
            camera.bottom = -d;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
